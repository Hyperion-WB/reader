name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: '摸鱼阅读 ${{ github.ref_name }}'
          body: |
            ### 🐟 摸鱼阅读 (MoYu Reader · 通透磨砂玻璃小说与漫画阅读器)
            - **单实例锁定与防重复启动**：后台运行时再次双击直接唤醒激活主窗口，杜绝双托盘图标与重复进程占用
            - **Legado 3.0 全格式书源**：支持 JSON/POST/相对路径书源搜索与一键测速 Ping
            - **0ms 后台章节智能预加载**：翻页与切章零等待
            - **自定义本地字体与封面上传**：支持 TTF/WOFF2 字体与本地图片替换书皮
            - **漫画图集支持**：支持 CBZ/ZIP 漫画包与漫画在线书源连续画卷阅读
            - **10 大全场景摸鱼伪装矩阵**（Excel、Word、Outlook、企微、VSCode、IDEA、PPT、便签条、24px 状态条）
            - **苹果级通透磨砂动效**：120 FPS 硬件加速与自适应自折叠窄窗口
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          overwrite: true
          draft: false
          prerelease: false
