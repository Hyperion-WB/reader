name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'LiquidReader v__VERSION__'
          releaseBody: 'Liquid Glass Stealth Novel Reader for Windows (通透磨砂玻璃摸鱼小说阅读器)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Direct GitHub Release Uploader (Unlimited Quota)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/liquid-reader.exe
          tag_name: ${{ github.ref_name }}
          name: 'LiquidReader ${{ github.ref_name }}'
          body: |
            ### 🧊 LiquidReader (通透磨砂玻璃风摸鱼小说阅读器)
            - 纯净通透磨砂无边框设计，16px 苹果级平滑圆角
            - 安卓/iPadOS 悬浮小窗顶部拖拽条
            - 5 大全场景办公摸鱼伪装矩阵（Excel 中文版、Word 公文、VS Code、IDEA、PDF 论文、便签条、24px 状态条）
            - 万章级高性能虚拟滚动目录引擎与全网 Legado 聚合搜书
          draft: false
          prerelease: false
