<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- App Icon Surface Gradient -->
    <linearGradient id="iconSurface" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>

    <!-- Droplet Body Gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Book Glass Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.75" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="3" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#iconSurface)" />

  <!-- Ambient Light Reflection -->
  <path d="M 140 34 C 80 34 34 80 34 140 C 34 200 180 120 280 90 C 380 60 478 120 478 140 C 478 80 432 34 372 34 Z" fill="rgba(255,255,255,0.15)" />

  <!-- Ambient Background Droplet Glow -->
  <circle cx="256" cy="270" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />

  <!-- Cute Droplet Creature Body -->
  <g filter="url(#shadow)">
    <!-- Droplet Teardrop Shape -->
    <path d="M 256 120 C 290 175 356 245 356 305 C 356 368 311 410 256 410 C 201 410 156 368 156 305 C 156 245 222 175 256 120 Z" fill="url(#dropGrad)" />

    <!-- Cute Eyes -->
    <!-- Left Eye -->
    <ellipse cx="225" cy="285" rx="13" ry="18" fill="#0f172a" />
    <circle cx="221" cy="279" r="6" fill="#ffffff" />
    <circle cx="228" cy="292" r="2.5" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="287" cy="285" rx="13" ry="18" fill="#0f172a" />
    <circle cx="283" cy="279" r="6" fill="#ffffff" />
    <circle cx="290" cy="292" r="2.5" fill="#ffffff" />

    <!-- Kawaii Pink Blush -->
    <ellipse cx="204" cy="305" rx="14" ry="7" fill="#f43f5e" opacity="0.6" />
    <ellipse cx="308" cy="305" rx="14" ry="7" fill="#f43f5e" opacity="0.6" />

    <!-- Cute Smile -->
    <path d="M 246 300 Q 256 312 266 300" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Glass Specular Highlight on Head -->
    <ellipse cx="230" cy="180" rx="18" ry="32" transform="rotate(-25 230 180)" fill="rgba(255,255,255,0.6)" />
    <circle cx="216" cy="225" r="7" fill="rgba(255,255,255,0.4)" />
  </g>

  <!-- Glowing Frosted Glass Mini Book in Hands -->
  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Left Page -->
    <path d="M 256 345 Q 210 325 170 335 L 170 395 Q 210 385 256 405 Z" fill="url(#bookGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 256 345 Q 302 325 342 335 L 342 395 Q 302 385 256 405 Z" fill="url(#bookGrad)" stroke="rgba(255,255,255,0.8)" stroke-width="2" />

    <!-- Book Spine Glow -->
    <line x1="256" y1="345" x2="256" y2="405" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Little Text Lines on Book -->
    <line x1="185" y1="352" x2="235" y2="346" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="185" y1="365" x2="238" y2="359" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="185" y1="378" x2="225" y2="373" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <line x1="277" y1="346" x2="327" y2="352" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="274" y1="359" x2="327" y2="365" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="287" y1="373" x2="327" y2="378" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

    <!-- Cute Hands Holding Book -->
    <circle cx="178" cy="370" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="334" cy="370" r="10" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M 370 180 Q 380 180 380 170 Q 380 180 390 180 Q 380 180 380 190 Q 380 180 370 180 Z" opacity="0.85" />
    <path d="M 125 240 Q 133 240 133 232 Q 133 240 141 240 Q 133 240 133 248 Q 133 240 125 240 Z" opacity="0.85" />
    <circle cx="360" cy="230" r="3" opacity="0.7" />
    <circle cx="150" cy="190" r="2.5" opacity="0.6" />
  </g>
</svg>
