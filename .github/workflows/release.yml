name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: '摸鱼阅读 ${{ github.ref_name }}'
          body: |
            ### 🐟 摸鱼阅读 (MoYu Reader · 通透磨砂玻璃小说与漫画阅读器)
            - 纯净通透磨砂无边框设计，16px 苹果级物理弹簧阻尼动效
            - 支持 TXT、EPUB、Markdown、ZIP/CBZ 漫画图集高清画卷连续流
            - 「连续瀑布流滚动 ⇋ 仿真单页翻页」双阅读引擎
            - 10 大办公全场景变身伪装矩阵（Excel、Word、Outlook、企业微信、VSCode、IDEA、PPT、便签条、24px 状态条）
            - 智能窄窗口折叠自适应与多书切换胶囊
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          overwrite: true
          draft: false
          prerelease: false
